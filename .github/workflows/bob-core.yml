name: Bob Core

on:
  pull_request:
    paths:
      - "Core/**"
      - ".github/workflows/bob-core.yml"
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "agent/**"
    paths:
      - "Core/**"
      - ".github/workflows/bob-core.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Core/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and test
        run: npm run check

  finalize-mcp-milestone:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/bob-core-mcp-codex'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Align service version and implementation log
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("Core/src/app.ts")
          app = app_path.read_text()
          old = 'const SERVICE_VERSION = "0.1.0";'
          new = 'const SERVICE_VERSION = "0.2.0";'
          if old in app:
              app_path.write_text(app.replace(old, new, 1))
          elif new not in app:
              raise SystemExit("Unexpected Bob Core service version declaration")

          test_path = Path("Core/tests/app.test.ts")
          test = test_path.read_text()
          test_old = 'version: "0.1.0",'
          test_new = 'version: "0.2.0",'
          if test_old in test:
              test_path.write_text(test.replace(test_old, test_new, 1))
          elif test_new not in test:
              raise SystemExit("Expected service version assertion not found")

          implementation_path = Path("implementation.md")
          implementation = implementation_path.read_text()
          marker = "## 2026-08-23 — Bob Core MCP and Codex shared-context preflight"
          if marker not in implementation:
              entry = "\n\n---\n\n## 2026-08-23 — Bob Core MCP and Codex shared-context preflight\n\n### Session summary\n\nAdded the first authenticated, read-only Bob Core MCP transport and project-scoped Codex preflight so Codex can retrieve the same Shared Context used by BobAI before substantial work.\n\n### Decisions made\n\n- Use MCP TypeScript Server v2 and Streamable HTTP at `/mcp`.\n- Reuse `SharedContextService` rather than creating Codex-specific state.\n- Expose only `bob_get_context` in the first phase.\n- Keep the bearer token out of Git and require `BOB_CORE_DEVICE_TOKEN` from the Codex environment.\n- Keep MCP writes disabled until the read path is accepted end to end.\n- Align Bob Core service/package/MCP versioning to `0.2.0`.\n\n### Files changed\n\n- Updated Core dependencies/lockfile and runtime composition.\n- Added `Core/src/mcp/`, MCP tests, root `AGENTS.md`, `.codex/config.toml`, and milestone documentation.\n- Updated service-version validation and this master implementation log.\n\n### Features completed\n\n- Authenticated `/mcp` endpoint.\n- Read-only `bob_get_context` tool with structured project context.\n- Required Codex Bob Core preflight with environment-sourced bearer authentication.\n\n### Validation performed\n\n- Locked install, TypeScript checking, and the full Vitest suite including MCP auth/list/call/error tests passed before finalization.\n- Final CI and Vercel preview validation are required after workflow restoration.\n\n### Security considerations\n\n- No bearer token, provider key, database URL, or other credential is committed.\n- Sensitive memories remain excluded and project memory remains isolated by project key.\n- MCP is read-only and omits internal database IDs/arbitrary metadata.\n\n### Next recommended tasks\n\n1. Restore the normal read-only CI workflow and run final validation.\n2. Merge/deploy the MCP endpoint after green CI and Vercel preview.\n3. Configure `BOB_CORE_DEVICE_TOKEN` in the authorized Codex environment.\n4. Run the first real Codex `bob_get_context` preflight, then design audited write tools.\n5. Connect ChatGPT to the same MCP contract after Codex validation.\n\n### Risks and dependencies\n\n- `required = true` intentionally blocks Codex startup when Bob Core or its credential is unavailable.\n- The single-owner bearer token should evolve toward revocable per-client credentials before broader use.\n"
              implementation_path.write_text(implementation.rstrip() + entry + "\n")
          PY

      - name: Commit targeted finalization
        run: |
          if git diff --quiet -- Core/src/app.ts Core/tests/app.test.ts implementation.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/src/app.ts Core/tests/app.test.ts implementation.md
          git commit -m "Finalize Bob Core MCP milestone"
          git push origin HEAD:${{ github.head_ref }}
