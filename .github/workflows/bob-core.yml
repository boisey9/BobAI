name: Bob Core

on:
  pull_request:
    paths:
      - "Core/**"
      - ".github/workflows/bob-core.yml"
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "agent/**"
    paths:
      - "Core/**"
      - ".github/workflows/bob-core.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Core/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and test
        run: npm run check

      - name: Resolve and verify Control Center production domain
        working-directory: .
        run: |
          FOUND=""
          for BASE in \
            https://bob-control-center.vercel.app \
            https://bob-control-center-erikboisvert9.vercel.app \
            https://bob-control-center-erikboisvert9-5389s-projects.vercel.app
          do
            echo "Checking $BASE"
            BODY=$(curl -sS -L --max-time 15 "$BASE/api/health" || true)
            if echo "$BODY" | jq -e '.status == "ok" and .service == "bob-control-center-web"' >/dev/null 2>&1; then
              FOUND="$BASE"
              break
            fi
            printf 'Response prefix: %.120s\n' "$BODY"
          done
          test -n "$FOUND"
          echo "CONTROL_CENTER_BASE=$FOUND" >> "$GITHUB_ENV"
          echo "Resolved public production domain: $FOUND"

      - name: Verify live Bob Core dashboard path
        working-directory: .
        run: |
          PROOF=$(curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$CONTROL_CENTER_BASE/api/proof")
          echo "$PROOF" | jq -e '
            .status == "ok" and
            .sessionValid == true and
            .coreReady == true and
            .memoryEnabled == true and
            .sharedContextEnabled == true and
            .projectKey == "bobai" and
            .hasTasks == true and
            .hasDecisions == true and
            .hasActivity == true and
            (.errors | length == 0)
          '

      - name: Verify owner login page
        working-directory: .
        run: |
          PAGE=$(curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors "$CONTROL_CENTER_BASE/login")
          echo "$PAGE" | grep -q 'Bob Control Center'
          echo "$PAGE" | grep -q 'Owner access'
