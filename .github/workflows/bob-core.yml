name: Bob Core

on:
  pull_request:
    paths:
      - "Core/**"
      - ".github/workflows/bob-core.yml"
  push:
    branches:
      - main
      - feature/bob-core-mvp
    paths:
      - "Core/**"
      - ".github/workflows/bob-core.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Core/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and test
        run: npm run check
