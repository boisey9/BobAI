name: Bob Control Center Web

on:
  pull_request:
    paths:
      - "Web/**"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "agent/**"
    paths:
      - "Web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run check
