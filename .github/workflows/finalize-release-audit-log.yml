name: Finalize release-audit implementation log

on:
  push:
    branches:
      - fix/release-audit-completion
    paths:
      - ".github/workflows/finalize-release-audit-log.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-audit-completion
          fetch-depth: 0

      - name: Append implementation entry
        run: python3 scripts/append_release_audit_log.py

      - name: Remove one-time helpers and commit the log
        shell: bash
        run: |
          rm scripts/append_release_audit_log.py
          rm .github/workflows/finalize-release-audit-log.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation.md \
            scripts/append_release_audit_log.py \
            .github/workflows/finalize-release-audit-log.yml

          if git diff --cached --quiet; then
            echo "No implementation-log changes were required."
            exit 0
          fi

          git commit -m "Document completed BobAI release audit [skip ci]"
          git push origin HEAD:fix/release-audit-completion
