name: Materialize BobAI release assets

on:
  push:
    branches:
      - fix/release-audit-completion
    paths:
      - ".github/workflows/materialize-release-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-audit-completion
          fetch-depth: 0

      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check cairosvg pillow

      - name: Generate and validate production assets
        run: |
          python3 scripts/generate_release_assets.py
          python3 scripts/validate_release_assets.py

      - name: Commit generated assets and remove helper workflow
        run: |
          rm .github/workflows/materialize-release-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BobAI/Resources/Assets.xcassets \
            .github/workflows/materialize-release-assets.yml

          git commit -m "Materialize production iOS assets"
          git push origin HEAD:fix/release-audit-completion
