name: Append release-audit implementation log

on:
  push:
    branches:
      - fix/release-audit-completion
    paths:
      - ".github/workflows/append-release-audit-log.yml"

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-audit-completion
          fetch-depth: 0

      - name: Append implementation record and remove helper
        shell: bash
        run: |
          cat >> implementation.md <<'EOF'

---

## 2026-08-16 — Voice interaction, Z.AI resilience, and release-audit completion

### Session summary

Completed a release-style review after physical iPhone testing exposed silent speech playback, manual voice-send behavior, keyboard focus problems, generic Z.AI failures, and an inaccurate model claim that Bob was text-only. The fixes preserve the approved Bob Core visual identity while making the interaction path practical on a real phone.

### Decisions made

- Use an explicit iOS playback audio session for Bob's spoken replies.
- Keep explicit push-to-talk, then auto-send after a short period without transcript changes.
- Allow a second Core tap to send immediately.
- Manage keyboard focus directly and provide multiple dismissal paths.
- Tell the model truthfully that the iPhone client reads replies aloud.
- Surface sanitized provider error codes and Bob Core request IDs in the app.
- Fall back between the free GLM 4.7 Flash and GLM 4.5 Flash models only for retryable provider failures.
- Test one real provider reply from Bob Core settings instead of treating health/status as sufficient.
- Keep history migration separate from concise approved memory and from executable skills.

### Files changed

- Updated `BobAI/Services/SpeechSynthesizer.swift`
- Updated `BobAI/Services/SpeechRecognizer.swift`
- Updated `BobAI/Services/BobCoreClient.swift`
- Updated `BobAI/ViewModels/ConversationViewModel.swift`
- Updated `BobAI/Views/HomeView.swift`
- Updated `BobAI/Views/BobCoreView.swift`
- Updated `BobAI/Views/CoreSettingsView.swift`
- Updated `Core/src/prompts/bob.ts`
- Updated `Core/src/ai/provider-error.ts`
- Updated `Core/src/ai/zai-provider.ts`
- Added and expanded Bob prompt, provider-error, and Z.AI fallback tests
- Added permanent Bob Core and iOS branch validation
- Added `docs/2026-08-16-voice-provider-and-continuity-plan.md`

### Features completed

- Audible spoken-response playback session
- Voice auto-send after a short pause
- Immediate send by tapping the Core again
- Keyboard Done control, focus dismissal, tap dismissal, and interactive scroll dismissal
- Accurate iPhone voice-capability instructions for Bob
- Z.AI business-code diagnostics and safe request identifiers
- Free-model fallback for retryable Z.AI failures
- Live provider probe from Bob Core settings
- Debug and Release iOS builds, asset verification, simulator launch smoke test, and screenshot artifact in CI
- Deterministic Bob Core dependency installation and complete backend validation

### Security and privacy

- No provider key, database URL, device token, signing material, or personal data was committed.
- Error messages expose only sanitized codes and request identifiers.
- Audio transcription and playback remain explicit device interactions.
- Raw history is not automatically promoted to persistent memory.
- Skills will require explicit schemas, permissions, and audit records rather than being treated as model memory.

### Validation

- Bob Core TypeScript checking and the complete test suite passed on the release-audit head.
- iOS Debug compilation passed with the app icon and launch resources compiled.
- Final simulator-launch, screenshot, and Release-build validation are required before PR #10 is merged.
- Physical iPhone audio and timing remain the final acceptance check after the validated build is installed.

### Next milestone

Build Bob Continuity Import v0.2: ingest a user-provided ChatGPT export into a reviewable search archive, promote only approved concise items into Neon memory, preserve provenance, and implement external capabilities through a permissioned Bob Core skill registry.
EOF

          rm .github/workflows/append-release-audit-log.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation.md .github/workflows/append-release-audit-log.yml
          git commit -m "Update implementation log for release audit [skip ci]"
          git push origin HEAD:fix/release-audit-completion
