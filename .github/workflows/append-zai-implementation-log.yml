name: Append Z.AI implementation log

on:
  push:
    branches:
      - feature/zai-glm-provider
    paths:
      - ".github/workflows/append-zai-implementation-log.yml"

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/zai-glm-provider
          fetch-depth: 0

      - name: Append master implementation entry
        shell: bash
        env:
          ENTRY_B64: 
        run: |
          set -euo pipefail

          python -c 'import base64, os; from pathlib import Path; p=Path("implementation.md"); text=p.read_text(); marker="## 2026-08-15 — Z.AI GLM provider integration"; entry=base64.b64decode(os.environ["ENTRY_B64"]).decode(); p.write_text(text if marker in text else text + entry)'

          rm .github/workflows/append-zai-implementation-log.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation.md .github/workflows/append-zai-implementation-log.yml

          if ! git diff --cached --quiet; then
            git commit -m "Update implementation log for Z.AI provider [skip ci]"
            git push origin HEAD:feature/zai-glm-provider
          fi
