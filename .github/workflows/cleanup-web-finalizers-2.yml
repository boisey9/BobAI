name: Final cleanup for Bob Control Center web

on:
  push:
    branches:
      - feature/bob-control-center-web
    paths:
      - ".github/workflows/cleanup-web-finalizers-2.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bob-control-center-web

      - name: Verify generated artifacts
        run: |
          test -f Web/package-lock.json
          grep -q "## 2026-08-23 — Bob Control Center Web v1" implementation.md

      - name: Remove all temporary finalizers
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-web.yml \
            .github/workflows/cleanup-web-finalizers.yml \
            .github/workflows/cleanup-web-finalizers-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary web finalizers"
          git push origin HEAD:feature/bob-control-center-web
