name: Generate MCP lockfile

on:
  push:
    branches:
      - feature/bob-core-mcp-codex
    paths:
      - "Core/package.json"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Core/package-lock.json

      - name: Generate lockfile without lifecycle scripts
        working-directory: Core
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- Core/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/package-lock.json
          git commit -m "Update lockfile for MCP server"
          git push origin HEAD:${GITHUB_REF_NAME}
