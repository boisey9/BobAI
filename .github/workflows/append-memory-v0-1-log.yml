name: Append Memory v0.1 implementation log

on:
  push:
    branches:
      - feature/memory-v0.1
    paths:
      - ".github/workflows/append-memory-v0-1-log.yml"

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/memory-v0.1
          fetch-depth: 0

      - name: Append release record and remove helper
        shell: bash
        env:
          LOG_B64: ""
        run: |
          set -euo pipefail
          marker="## 2026-08-16 — Memory v0.1 production migration and release validation"
          if ! grep -Fq "$marker" implementation.md; then
            printf '%s' "$LOG_B64" | base64 --decode >> implementation.md
          fi
          rm .github/workflows/append-memory-v0-1-log.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add implementation.md .github/workflows/append-memory-v0-1-log.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update implementation log for Memory v0.1 [skip ci]"
            git push origin HEAD:feature/memory-v0.1
          fi
