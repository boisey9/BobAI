# One-shot branch-only finalizer. Remove after it commits the targeted edits.
name: Finalize MCP milestone

on:
  push:
    branches:
      - feature/bob-core-mcp-codex
    paths:
      - ".github/workflows/mcp-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Align service version and implementation log
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("Core/src/app.ts")
          app = app_path.read_text()
          old = 'const SERVICE_VERSION = "0.1.0";'
          new = 'const SERVICE_VERSION = "0.2.0";'
          if old in app:
              app_path.write_text(app.replace(old, new, 1))
          elif new not in app:
              raise SystemExit("Unexpected Bob Core service version declaration")

          test_path = Path("Core/tests/app.test.ts")
          test = test_path.read_text()
          test_old = 'version: "0.1.0",'
          test_new = 'version: "0.2.0",'
          if test_old in test:
              test_path.write_text(test.replace(test_old, test_new, 1))
          elif test_new not in test:
              raise SystemExit("Expected service version assertion not found")

          implementation_path = Path("implementation.md")
          implementation = implementation_path.read_text()
          marker = "## 2026-08-23 — Bob Core MCP and Codex shared-context preflight"
          if marker not in implementation:
              entry = r'''

---

## 2026-08-23 — Bob Core MCP and Codex shared-context preflight

### Session summary

Implemented the first standards-based Bob Core MCP transport and project-scoped Codex integration. Codex can now be configured to require Bob Core and retrieve the same authoritative Shared Context used by BobAI before substantial repository work. The first MCP phase is intentionally read-only.

### Decisions made

- Use the stable MCP TypeScript Server v2 package and Streamable HTTP at `/mcp`.
- Reuse `SharedContextService`; do not create a Codex-specific memory or project-state implementation.
- Expose only `bob_get_context` in the first MCP milestone.
- Protect MCP with the existing Bob Core bearer-token value.
- Keep the bearer token out of Git and reference `BOB_CORE_DEVICE_TOKEN` from the Codex execution environment.
- Make Bob Core a required project-scoped Codex MCP server so Codex does not silently perform BobAI work without the Core.
- Return a minimized structured projection that omits internal database IDs and arbitrary metadata.
- Keep MCP writes disabled until the read path is accepted end to end.
- Align the Bob Core service/package/MCP release version to `0.2.0`.

### Files changed

- Updated `Core/package.json` and `Core/package-lock.json`.
- Added `Core/src/mcp/server.ts` and `Core/src/mcp/mount.ts`.
- Added `Core/src/runtime.ts` and updated `Core/src/index.ts` / `Core/src/server.ts`.
- Added `Core/tests/mcp.test.ts`.
- Updated the Bob Core public service version and its regression assertion.
- Added root `AGENTS.md`.
- Added project-scoped `.codex/config.toml`.
- Added `docs/2026-08-23-bob-core-mcp-codex.md`.
- Updated `implementation.md`.

### Features completed

- Authenticated remote Bob Core MCP endpoint.
- Read-only `bob_get_context` tool backed by Shared Context v0.2.
- Structured MCP output for project, decisions, tasks, recent events, and approved relevant memory.
- Tool annotations for read-only, non-destructive, idempotent behavior.
- Bob Core server-level MCP instructions for cross-tool context discipline.
- Codex Bob Core preflight rules through `AGENTS.md`.
- Required project-scoped Codex MCP configuration with an environment-sourced token.
- Shared runtime composition for Vercel and local Node execution.

### Validation performed

- The dependency lockfile was generated from npm with lifecycle scripts disabled and the temporary generator removed.
- Locked dependency installation passed on Node.js 24.
- TypeScript checking passed.
- The complete Vitest suite, including MCP authentication, tool listing, context retrieval, and unknown-project behavior, passed on the first integration run.
- A final CI run is required after the service-version alignment before merge.

### Security considerations

- No Bob Core bearer token, provider key, database URL, or other credential was committed.
- MCP is read-only.
- Sensitive memories remain excluded by Shared Context.
- Project memories remain isolated by project key.
- MCP tool results omit internal database IDs and arbitrary metadata.
- Safe errors replace raw database/provider failures.

### Open questions

- The authorized Codex environment still needs the existing `BOB_CORE_DEVICE_TOKEN` value before a real production MCP handshake can succeed.
- MCP write tools require a separate authorization, confirmation, audit, and least-privilege design before implementation.

### Next recommended tasks

1. Complete final CI and Vercel preview validation.
2. Merge and deploy the read-only Bob Core MCP endpoint.
3. Configure `BOB_CORE_DEVICE_TOKEN` in the authorized Codex environment.
4. Run the first real Codex `bob_get_context` preflight against production Bob Core.
5. Mark the Codex connection accepted in Bob Core project state.
6. Design audited MCP write tools only after read-path acceptance.
7. Connect ChatGPT to the same MCP contract after Codex validation.

### Risks and dependencies

- `required = true` intentionally prevents Codex from silently proceeding when Bob Core cannot initialize; an environment missing the bearer token will therefore fail the Bob Core MCP startup check.
- The current single-owner bearer token is acceptable for the private MVP but should evolve toward revocable per-client credentials before broader use.
'''
              implementation_path.write_text(implementation.rstrip() + entry + "\n")
          PY

      - name: Commit finalization changes
        run: |
          if git diff --quiet -- Core/src/app.ts Core/tests/app.test.ts implementation.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/src/app.ts Core/tests/app.test.ts implementation.md
          git commit -m "Finalize Bob Core MCP milestone"
          git push origin HEAD:${GITHUB_REF_NAME}
