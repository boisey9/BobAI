name: Memory v0.1 compile stabilization

on:
  push:
    branches:
      - feature/memory-v0.1
    paths:
      - ".github/workflows/memory-v0-1-stabilize.yml"

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/memory-v0.1
          fetch-depth: 0

      - name: Apply targeted TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path("Core/src/app.ts")
          text = app.read_text()
          text = text.replace(
              "  memoryService?: MemoryService;\n",
              "  memoryService?: MemoryService | undefined;\n",
          )
          text = text.replace(
              "      if (memoryCommand) {\n",
              "      if (memoryService && memoryCommand) {\n",
              1,
          )
          text = text.replace(
              "        const generated = await aiProvider.generate(parsed.data.messages, {\n"
              "          ...(memoryContext ? { memoryContext } : {}),\n"
              "        });",
              "        const generated = memoryContext\n"
              "          ? await aiProvider.generate(parsed.data.messages, { memoryContext })\n"
              "          : await aiProvider.generate(parsed.data.messages);",
          )
          app.write_text(text)

          config_fields = (
              "  databaseURL: undefined,\n"
              "  ownerId: \"rick\",\n"
              "  memoryEnabled: false,\n"
              "  memoryRetrievalLimit: 6,\n"
          )
          for filename in [
              "Core/tests/app.test.ts",
              "Core/tests/openai-provider-import.test.ts",
              "Core/tests/provider-factory.test.ts",
              "Core/tests/zai-provider-request.test.ts",
          ]:
              path = Path(filename)
              value = path.read_text()
              if "  databaseURL:" not in value:
                  value = value.replace(
                      "  deviceToken:",
                      config_fields + "  deviceToken:",
                      1,
                  )
              path.write_text(value)
          PY

          rm .github/workflows/memory-v0-1-stabilize.yml

      - name: Validate backend
        working-directory: Core
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Commit stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core .github/workflows/memory-v0-1-stabilize.yml
          git commit -m "Stabilize Memory v0.1 TypeScript integration [skip ci]"
          git push origin HEAD:feature/memory-v0.1
